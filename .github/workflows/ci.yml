name: CI

# Build + test on every push to main and every pull request. No secrets, no
# infra — this is the foundation that makes `main` provably green and deployable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: selflearn-core (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/selflearn-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Walk-forward demo smoke (synthetic, must run clean)
        run: python -m examples.walkforward_demo

  test-tooling:
    name: automation tooling (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned local development environment
        run: python scripts/bootstrap_dev.py --install
      - name: Test offline inventory and secret-safe diagnostics
        run: .venv/bin/python -m pytest -q tests/tooling
      - name: Check SHADOW-only development profile
        run: .venv/bin/python scripts/automation_readiness.py --require-dev

  test-packages:
    # execution-core holds the risk gate and broker adapters; signals holds the
    # indicators. Both have suites that previously never ran in CI.
    name: ${{ matrix.pkg }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [packages/execution-core, packages/signals]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  test-database-candidate:
    name: database candidate (local only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/automation/supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/automation/supabase/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned disposable database test tools
        run: npm ci
      - name: Test schema permissions and append-only behavior
        run: npm test
      - name: Test read-only readiness checker
        run: python -m unittest discover -s test -p 'test_*.py'

  test-shared-database:
    name: shared trading database (local only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/automation/supabase-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/automation/supabase-shared/package-lock.json
      - name: Install pinned disposable database test tools
        run: npm ci --no-audit --no-fund
      - name: Test shared-project isolation and scoped RPCs
        run: npm test
