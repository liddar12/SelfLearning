name: CI

# Build + test on every push to main and every pull request. No secrets, no
# infra — this is the foundation that makes `main` provably green and deployable.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: selflearn-core (pytest)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: packages/selflearn-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Walk-forward demo smoke (synthetic, must run clean)
        run: python -m examples.walkforward_demo

  hosted:
    name: hosted boundaries (local fakes; no cloud writes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: packages/selflearn-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked hosted runtime and test runner
        run: python -m pip install -r requirements.txt 'pytest>=8.0'
      - name: Check dependency consistency
        run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned local PostgreSQL-WASM test dependency outside application
        run: |
          npm install --prefix "$RUNNER_TEMP/selflearn-pglite" --no-save --package-lock=false @electric-sql/pglite@0.3.16
          printf 'SELFLEARN_PGLITE_MODULE=%s\n' "$RUNNER_TEMP/selflearn-pglite/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Run actual SQL discovery and exact job lookup sequentially
        run: node --test --test-concurrency=1 tests/postgres/learning_job_discovery.test.mjs tests/postgres/learning_job_find.test.mjs
      - name: Verify roster evidence migration, durable capture paths and legacy replay
        run: >-
          node --test --test-concurrency=1
          tests/postgres/nfl_roster_capture_transport.test.mjs
          tests/postgres/capture_delivery.test.mjs
          tests/postgres/capture_application.test.mjs
          tests/postgres/game_scoped_capture.test.mjs
          tests/postgres/batched_objects.test.mjs
          tests/postgres/scoped_journal_paging.test.mjs
          tests/postgres/scoped_history_paging.test.mjs
          tests/postgres/generation_authority_proofs.test.mjs
          tests/postgres/game_cache_recycling.test.mjs
      - name: Check out the immutable public NFL producer fixture
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: liddar12/NFL2026
          ref: fd8e8055dcfd60850e17a5029c0c0103f8c9de55
          path: .nfl2026-fixture
          persist-credentials: false
      - name: Run Python discovery, scoped provenance and lookup through PostgreSQL-WASM
        env:
          NFL2026_CHECKOUT: ${{ github.workspace }}/.nfl2026-fixture
        run: >-
          python -m pytest
          tests/postgres/test_learning_job_discovery_adapter.py
          tests/postgres/test_learning_job_find_adapter.py
          tests/postgres/test_batched_object_adapter.py
          tests/postgres/test_generation_proof_adapter.py -q -rs
      - name: Test hosted authorization, persistence contracts and test tooling
        run: python -m pytest tests packages/selflearn-core/tests/test_supabase_store.py --ignore=tests/postgres -q -rs
      - name: Declare independent release evidence still required
        run: >-
          echo 'Generation provenance is tested against the pinned public NFL fixture.
          This job uses no production cloud credentials. Separate hosted canaries
          verify durable processing and replay in production.'

  native-postgres:
    name: native PostgreSQL 17 transaction gate (disposable; no cloud writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: selflearn_journal_test
          # This credential exists only inside the disposable CI service.
          POSTGRES_PASSWORD: selflearn_journal_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selflearn_journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SELFLEARN_NATIVE_PG_DSN: postgresql://postgres:selflearn_journal_test_only@127.0.0.1:5432/selflearn_journal_test
      # Missing DSN/client must fail CI, never yield a green skipped native gate.
      SELFLEARN_REQUIRE_NATIVE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure native PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Run actual separate-connection receipt journal concurrency tests
        run: python -m unittest discover -s tests/postgres -p test_native_concurrency.py -v
      - name: Declare the deployment boundary
        run: >-
          echo 'This gate applies only the receipt journal migration to a fresh local
          PostgreSQL 17 service. Native transaction evidence is not a hosted
          Supabase/PostgREST round trip or authorization to deploy or adopt models.'

  native-observed-postgres:
    name: native observed journal CAS gate (fresh database; no cloud writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: selflearn_journal_test
          POSTGRES_PASSWORD: selflearn_journal_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selflearn_journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SELFLEARN_NATIVE_PG_DSN: postgresql://postgres:selflearn_journal_test_only@127.0.0.1:5432/selflearn_journal_test
      SELFLEARN_REQUIRE_NATIVE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure native PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Run observed index and atomic outcome transaction tests
        run: python -m unittest discover -s tests/postgres -p test_native_observed_concurrency.py -v
      - name: Declare the independent hosted boundary
        run: >-
          echo 'This independent fresh database applies both journal migrations.
          Native CAS evidence does not verify hosted grants/PostgREST, public
          outcome transport, production release or model activation.'

  native-publication-postgres:
    name: native publication evidence gate (fresh PostgreSQL 17; no cloud writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: selflearn_journal_test
          POSTGRES_PASSWORD: selflearn_journal_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selflearn_journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SELFLEARN_NATIVE_PG_DSN: postgresql://postgres:selflearn_journal_test_only@127.0.0.1:5432/selflearn_journal_test
      SELFLEARN_REQUIRE_NATIVE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure native PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Execute publication evidence, replay, clock and privilege transactions
        run: python -m unittest discover -s tests/postgres -p test_native_publication.py -v
      - name: Create separate disposable collection database and install test dependencies
        env:
          PGPASSWORD: selflearn_journal_test_only
        run: |
          psql -X -w -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE selflearn_collection_test'
          python -m pip install -r requirements.txt 'psycopg[binary]==3.2.12'
      - name: Verify native collection handoff recovery and immutable grants
        env:
          SELFLEARN_NATIVE_PG_DSN: postgresql://postgres:selflearn_journal_test_only@127.0.0.1:5432/selflearn_collection_test
        run: python -m unittest discover -s tests/postgres -p test_native_collection_handoff.py -v
      - name: Declare the independent hosted boundary
        run: >-
          echo 'This fresh disposable database applies journal, observed and publication
          migrations. Actual separate connections verify transaction locking and DB
          clocks; this is not a hosted Supabase/PostgREST or public HTTP proof.'

  native-job-discovery-postgres:
    name: native job discovery, lookup and competing claims (fresh PostgreSQL 17; no cloud writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: selflearn_journal_test
          POSTGRES_PASSWORD: selflearn_journal_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selflearn_journal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SELFLEARN_NATIVE_PG_DSN: postgresql://postgres:selflearn_journal_test_only@127.0.0.1:5432/selflearn_journal_test
      SELFLEARN_REQUIRE_NATIVE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure native PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Execute real discovery, competing claims, expiry, policy filters and grants
        run: python -m unittest discover -s tests/postgres -p test_native_job_discovery.py -v
      - name: Declare the independent hosted boundary
        run: >-
          echo 'This separate fresh loopback database applies the full migration chain.
          Discovery is read-only and grants no ownership; atomic claims are verified
          on separate connections. Native evidence is not hosted Supabase verification
          or permission to enable learning, deploy or adopt a model.'
  test-packages:
    # execution-core holds the risk gate and broker adapters; signals holds the
    # indicators. Both have suites that previously never ran in CI.
    name: ${{ matrix.pkg }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [packages/execution-core, packages/signals]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
